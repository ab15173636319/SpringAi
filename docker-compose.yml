services:
  redis:
    image: redis:8-alpine
    container_name: aether-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - aether_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: aether-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "123456"
    volumes:
      - aether_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "123456",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aether_mongo_data:
  aether_redis_data:
