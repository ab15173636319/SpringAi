server:
  port: 8080
  http2:
    enabled: true

spring:
  application:
    name: aether-ai
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGODB_URI:mongodb://root:123456@localhost:27017/aether_ai?authSource=admin}
    auto-index-creation: true
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_API_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: 0.6

app:
  ai:
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    daily-limit: ${AI_DAILY_LIMIT:100}
  security:
    jwt:
      issuer: aether-ai
      secret: ${JWT_SECRET}
      access-ttl: 15m
      refresh-ttl: 7d
    cookie:
      name: aether_refresh
      secure: ${COOKIE_SECURE:false}
      same-site: Lax
      path: ${COOKIE_PATH:/api/auth}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info
    com.aether: info
    org.springframework.ai.chat.client: warn

config:
  limit:
    device_call_count_prefix: "device:call_count:"
    call_count_expire_day: 1
    max_call_count: 100
  gaode:
    apikey: ${GAODE_API_KEY:}
    amap_ip_url: https://restapi.amap.com/v3/ip # 获取ip定位
    amap_weather: https://restapi.amap.com/v3/weather/weatherInfo # 获取天气信息
    amap_driving: https://restapi.amap.com/v5/direction/driving # 路径规划
    amap_walking: https://restapi.amap.com/v3/direction/walking # 路径规划
    amap_geocode: https://restapi.amap.com/v3/geocode/geo # 地址编码
    amap_road: https://restapi.amap.com/v3/traffic/status/road # 获取道路交通状态 未使用
    amap_bus: https://restapi.amap.com/v3/bus/stopid # 获取公交站点信息 未使用
    amap_etd_driving: https://restapi.amap.com/v4/etd/driving # 高级路线规划 未使用
  showapi:
    appKey: ${SHOWPIECE_APIKEY:}
    huangli: https://route.showapi.com/856-2

